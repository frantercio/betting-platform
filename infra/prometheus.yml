global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'admin'
    static_configs:
      - targets: ['admin:8083']
    metrics_path: '/admin/metrics'
  - job_name: 'wallet'
    static_configs:
      - targets: ['wallet:8080']
  - job_name: 'user'
    static_configs:
      - targets: ['user:8081']
  - job_name: 'betting'
    static_configs:
      - targets: ['betting:8082']
