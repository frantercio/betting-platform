version: '3.8'
services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - admin
      - wallet
      - user
      - betting

  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: betting
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  admin:
    build: ./services/admin
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/betting
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    ports:
      - "8083:8083"

  wallet:
    build: ./services/wallet
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/betting
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8080:8080"

  user:
    build: ./services/user
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/betting
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8081:8081"

  betting:
    build: ./services/betting
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/betting
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8082:8082"

volumes:
  pgdata:
