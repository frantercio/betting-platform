services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bets
      POSTGRES_PASSWORD: bets_local_only
      POSTGRES_DB: betting
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bets"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: bitnami/kafka:3.7
    ports: ["9092:9092"]
    environment:
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_PROCESS_ROLES: "broker,controller"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CFG_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://localhost:9092"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20

  wallet:
    build: ./services/wallet
    ports: ["8080:8080"]
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://bets:bets_local_only@postgres:5432/betting?sslmode=disable"
      JWT_SECRET: "dev-secret-change-me"
      PIX_SECRET: "dev-pix-secret"
    depends_on:
      postgres:
        condition: service_healthy

  user:
    build: ./services/user
    ports: ["8081:8081"]
    environment:
      PORT: "8081"
      DATABASE_URL: "postgres://bets:bets_local_only@postgres:5432/betting?sslmode=disable"
      JWT_SECRET: "dev-secret-change-me"
    depends_on:
      postgres:
        condition: service_healthy

  betting:
    build: ./services/betting
    ports: ["8082:8082"]
    environment:
      PORT: "8082"
      DATABASE_URL: "postgres://bets:bets_local_only@postgres:5432/betting?sslmode=disable"
      JWT_SECRET: "dev-secret-change-me"
    depends_on:
      postgres:
        condition: service_healthy

  admin:
    build: ./services/admin
    ports: ["8083:8083"]
    environment:
      PORT: "8083"
      DATABASE_URL: "postgres://bets:bets_local_only@postgres:5432/betting?sslmode=disable"
      JWT_SECRET: "dev-secret-change-me"
      ADMIN_KEY: "dev-admin-key"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata: